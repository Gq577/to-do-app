name: real-ci
on: 
  workflow_dispatch:

permissions: 
  packages: write
  contents: read
jobs:
  test-the-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
      - name: install freamworks
        run: npm install
      - name: install jest
        run: npm install --save-dev jest supertest mongodb-memory-server
      - name: test by jest
        run: npm test


  build-and-push:
    needs: test-the-code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/to-do-app:latest
            ${{ secrets.DOCKER_USER }}/to-do-app:${{ github.sha }}

          
  cd:
    needs: build-and-push
    runs-on: ubuntu-22.04

    steps:
      - name: connent-to-EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker stop to-do-app-continaer || true
            docker rm to-do-app-continaer || true
            docker pull ${{ secrets.DOCKER_USER }}/to-do-app:latest
            docker run -d -p 80:3000 --name to-do-app-continaer ${{ secrets.DOCKER_USER }}/to-do-app:latest
            docker image prune -f
          
      
    
