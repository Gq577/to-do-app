name: Node.js CI with Real MySQL

on:
  workflow_dispatch: 
  push:
    branches: ["master" , "main" , "mysql"]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    # تشغيل سيرفر MySQL كـ Container مؤقت في بيئة الـ CI
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: test_app_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      # تجهيز الجدول المطلوب قبل تشغيل الاختبارات
      - name: Create Database Tables
        run: |
          mysql -h 127.0.0.1 -u root -ptestpassword test_app_db -e "
          CREATE TABLE IF NOT EXISTS habits (
            id INT AUTO_INCREMENT PRIMARY KEY,
            study BOOLEAN,
            sport BOOLEAN,
            sleep VARCHAR(50),
            wakeup VARCHAR(50)
          );"

      # تشغيل اختبارات التكامل وتمرير متغيرات بيئة الـ CI
      - name: Run Integration Tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: test_app_db
        run: npm test
