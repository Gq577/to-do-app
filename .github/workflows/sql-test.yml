name: Node.js CI/CD

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: test_app_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Create Database Tables
        run: |
          mysql -h 127.0.0.1 -u root -ptestpassword test_app_db -e "
          CREATE TABLE IF NOT EXISTS habits (
            id INT AUTO_INCREMENT PRIMARY KEY,
            study BOOLEAN,
            sport BOOLEAN,
            sleep VARCHAR(50),
            wakeup VARCHAR(50)
          );"

      - name: Run Integration Tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: test_app_db
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/to-do-app:latest
            ${{ secrets.DOCKER_USER }}/to-do-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            ./deployment.sh ${{ secrets.DOCKER_USER }}/to-do-app:${{ github.sha }}