name: Node.js CI with Real MySQL

on:
  workflow_dispatch: 
  push:
    branches: ["master" , "main" , "mysql"]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: test_app_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

  
      - name: Create Database Tables
        run: |
          mysql -h 127.0.0.1 -u root -ptestpassword test_app_db -e "
          CREATE TABLE IF NOT EXISTS habits (
            id INT AUTO_INCREMENT PRIMARY KEY,
            study BOOLEAN,
            sport BOOLEAN,
            sleep VARCHAR(50),
            wakeup VARCHAR(50)
          );"

      
      - name: Run Integration Tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: test_app_db
        run: npm test
        
  build-and-push:
    needs: integration-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/to-do-app:latest
            ${{ secrets.DOCKER_USER }}/to-do-app:${{ github.sha }}
          
  cd:
    needs: build-and-push
    runs-on: ubuntu-22.04

    steps:
      - name: connent-to-EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            
            docker stop to-do-app-continaer || true
            docker rm to-do-app-continaer || true
            docker pull ${{ secrets.DOCKER_USER }}/to-do-app:latest
            docker run -d -p 80:3000 --name to-do-app-continaer ${{ secrets.DOCKER_USER }}/to-do-app:latest
            docker image prune -f
          
      
    
