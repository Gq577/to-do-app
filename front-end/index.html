<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="a">
        <div class="a1">برنامج تتبع العادات</div>
        <div class="a2">
            <div class="a21">رياضة</div>
            <div class="a22">
                <input type="radio" name="yes" id="sportYes" value="yes">
                <div class="a221">نعم</div>
            </div>
            <div class="a22">
                <input type="radio" name="yes" id="sportNo" value="no">
                <div class="a221">لا</div>
            </div>
        </div>
        <div class="a2">
            <div class="a21">دراسه</div>
            <div class="a22">
                <input type="radio" name="yes1" id="studyYes" value="yes">
                <div class="a221">نعم</div>
            </div>
            <div class="a22">
                <input type="radio" name="yes1" id="studyNo" value="no">
                <div class="a221">لا</div>
            </div>
        </div>
        <div class="a4">
            <div class="a41">اوقات النوم</div>
            <div class="a41">
                <input type="time" name="sleepTime" id="sleepTime">
                <label for="sleepTime">وقت النوم</label>
            </div>
            <div class="a42">
                <input type="time" name="wakeup" id="wakeup">
                <label for="wakeup">وقت الصحيان</label>
            </div>
        </div>
        <div class="a5">
            <button id="button">submit</button>
        </div>
        <div id="a6"></div>
    </div>
</body>
<script>
    function $(a){
        return document.getElementById(a)
    };
     function sendData(data) {
          const response =  fetch('http://http://50.19.17.206/api', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
          });
    }       

    $("button").addEventListener("click",() => {
        const selectedRadio = document.querySelector('input[name="yes"]:checked');
        const selecteRadio2 =  document.querySelector("input[name='yes1']:checked");
        const sleepTime = $("sleepTime");
        const wakeup = $("wakeup");
        
        if (selecteRadio2 === null|| selectedRadio === null || sleepTime.value === '' || wakeup.value === ''){ 
            $("a6").textContent = "إملا كل الخانات رجائا"
        }
        else {
            sendData({
                sport:selectedRadio.value,
                study:selecteRadio2.value,
                sleep:sleepTime.value,
                wakeup:wakeup.value
            });
        }

    })
</script>
</html>
